; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = firmware
lib_dirs = lib

[env]
build_flags = 
	-D MAX_NUM_SLAVE=20

[env:master]
platform = espressif32
board = lolin_s3_mini
framework = arduino
build_src_filter = 
	+<master/src/*.cpp>
	+<shared/src/*.cpp>
	+<shared/src/storymode/*.cpp>
	+<shared/src/patterns/*.cpp>
	+<shared/src/lib/*.cpp>
build_flags = 
	${env.build_flags}
	-I master/include
	-I shared/include
	-D IS_MASTER=1
	-D WIFI_NAME=\"green_pepper_master\"
	-D ACTUAL_SLAVE_NUM=2
	-D SLAVE_I2C_ADDR=0x10  ; 不用改這裡！
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-DPIO_FRAMEWORK_ARDUINO_SPIFFS_ENABLE
board_build.filesystem = spiffs 
board_build.flash_mode = dio
board_build.flash_freq = 80m
lib_deps = 
	fastled/FastLED@3.9.6
	madhephaestus/ESP32Encoder
	https://github.com/tzapu/WiFiManager.git
	mathertel/OneButton
	adafruit/Adafruit BusIO@^1.16.2
	; adafruit/Adafruit PWM Servo Driver Library@^3.0.2
monitor_speed = 115200
upload_speed = 115200

[env:slave1] 
platform = espressif32
board = lolin_s3_mini
framework = arduino
build_src_filter = 
	+<slave/src/*.cpp>
	+<shared/src/*.cpp>
	+<shared/src/storymode/*.cpp>
	+<shared/src/patterns/*.cpp>
	+<shared/src/lib/*.cpp>
build_flags = 
	${env.build_flags}
	-I slave/include
	-I shared/include

	;----------SLAVE設定----------
	-D WIFI_NAME=\"green_pepper_slave1\" 
	-D IS_SLAVE=1
	-D SLAVE_I2C_ADDR=0x10
	-D SLAVE_ID=1

	;----------PWM相關設定----------
	-D MAX_NUM_PWM=25
	-D ACTUAL_NUM_PWM=7
	-D PWM_ADDRESS_1=0x40
	-D PWM_ADDRESS_2=0x4A
	-D PWM_ADDRESS_3=0x42
	-D PWM_ADDRESS_4=0x43
	-D PWM_ADDRESS_5=0x44
	-D PWM_ADDRESS_6=0x61
	-D PWM_ADDRESS_7=0x6B
	-D PWM_ADDRESS_8=0x47
	-D PWM_ADDRESS_9=0x48
	-D PWM_ADDRESS_10=0x49
	-D PWM_ADDRESS_11=0x4A
	-D PWM_ADDRESS_12=0x4B
	-D PWM_ADDRESS_13=0x4C
	-D PWM_ADDRESS_14=0x4D
	-D PWM_ADDRESS_15=0x4E
	-D PWM_ADDRESS_16=0x4F
	-D PWM_ADDRESS_17=0x50
	-D PWM_ADDRESS_18=0x51
	-D PWM_ADDRESS_19=0x52
	-D PWM_ADDRESS_20=0x53
	-D PWM_ADDRESS_21=0x54
	-D PWM_ADDRESS_22=0x55
	-D PWM_ADDRESS_23=0x56
	-D PWM_ADDRESS_24=0x57
	-D PWM_ADDRESS_25=0x58

	;----------彩色LED燈珠數目----------
	-D NUM_LEDS_RGB1=100
	-D NUM_LEDS_RGB2=50
	-D NUM_LEDS_RGB3=10
	-D NUM_LEDS_RGB4=10

	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-DPIO_FRAMEWORK_ARDUINO_SPIFFS_ENABLE
board_build.filesystem = spiffs 
board_build.flash_mode = dio
board_build.flash_freq = 80m
lib_deps = 
	fastled/FastLED@3.9.6
	https://github.com/tzapu/WiFiManager.git
	adafruit/Adafruit BusIO@^1.16.2
monitor_speed = 115200
upload_speed = 115200

