<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 晶片登入</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="upload-container">
        <div class="upload-header">
            <img src="logo.png" alt="Logo" class="logo">
            <h1>ESP32 晶片登入</h1>
            <p>請輸入登入資訊</p>
        </div>
        <form name="loginForm">
            <div class="input-group">
                <input name="userid" placeholder="User ID" class="login-input">
            </div>
            <div class="input-group">
                <input name="pwd" placeholder="Password" type="Password" class="login-input">
            </div>
            <input type="submit" onclick="check(this.form)" class="btn" value="Login">
        </form>
    </div>
    <script>
        function check(form) {
            if (form.userid.value == 'admin' && form.pwd.value == 'admin') {
                window.open('/serverIndex');
            } else {
                alert('Error Password or Username');
            }
        }
    </script>
</body>
</html>
