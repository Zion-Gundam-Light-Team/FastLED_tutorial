<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>上傳firmware</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
</head>

<body>
    <div class="upload-container">
        <div class="upload-header">
            <img src="logo.png" alt="Logo" class="logo">
            <h1>更新Firmware</h1>
            <p>請上傳新的.bin 檔案</p>
        </div>

        <form method='POST' action='#' enctype='multipart/form-data' id='upload_form'>
            <input type='file' name='update' id='file' onchange='sub(this)' style='display:none'>
            <label id='file-input' for='file'>
                <svg class="file-icon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M14,2H6A2,2 0 0,0 4,4V20A2,2 0 0,0 6,22H18A2,2 0 0,0 20,20V8L14,2M18,20H6V4H13V9H18V20Z" />
                </svg>
                請選擇檔案...
            </label>
            <input type='submit' class='btn' value='Update Firmware'>

            <div id='prg'></div>
            <div id='prgbar'>
                <div id='bar'></div>
            </div>
            <div class="success-message" id="success">成功上傳！</div>
        </form>
    </div>

    <script>
        function sub(obj) {
            var fileName = obj.value.split('\\\\');
            document.getElementById('file-input').innerHTML = '<svg class="file-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M14,2H6A2,2 0 0,0 4,4V20A2,2 0 0,0 6,22H18A2,2 0 0,0 20,20V8L14,2M18,20H6V4H13V9H18V20Z"/></svg>' + fileName[fileName.length - 1];
        };

        $('form').submit(function (e) {
            e.preventDefault();
            var form = $('#upload_form')[0];
            var data = new FormData(form);

            $('.btn').prop('disabled', true).val('Updating...');
            $('#success').hide();

            $.ajax({
                url: '/update',
                type: 'POST',
                data: data,
                contentType: false,
                processData: false,
                xhr: function () {
                    var xhr = new window.XMLHttpRequest();
                    xhr.upload.addEventListener('progress', function (evt) {
                        if (evt.lengthComputable) {
                            var per = evt.loaded / evt.total;
                            var percentage = Math.round(per * 100);
                            $('#prg').html('Progress: ' + percentage + '%');
                            $('#bar').css('width', percentage + '%');
                            
                            if (percentage === 100) {
                                $('.btn').hide();
                                $('#success').text('成功上傳').show();
                            }
                        }
                    }, false);
                    return xhr;
                },
                success: function (d, s) {
                    console.log('success!');
                    $('#prg').html('Update completed');
                    $('#success').show();
                    $('.btn').prop('disabled', false).val('Update Firmware');
                },
                error: function (a, b, c) {
                    $('#prg').html('Update failed');
                    $('.btn').prop('disabled', false).val('Update Firmware');
                }
            });
        });
    </script>
</body>

</html>
